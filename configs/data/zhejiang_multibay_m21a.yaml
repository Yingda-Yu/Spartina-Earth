# Zhejiang three-bay multi-sensor sampling frame — M2.1a (Issue #7)
#
# STAGE BOUNDARY: scientific sampling frame only. This config drives ROI
# provenance derivation, the legacy-label inventory and the metadata-only
# EO observational census. It MUST NOT trigger bulk imagery export,
# bay-wide GeoTIFF downloads, model training or dataset freeze.
#
# Evidence labels:
#   VERIFIED     - source text/data actually fetched and read on 2026-10-01
#   PROVISIONAL  - derived / approximate, kept under explicit parameters
#   BLOCKED      - access not possible through compliant public channels
#   UNKNOWN      - no evidence found; never guessed
#
# Every bay geometry here is a Tier-C DETERMINISTIC DERIVATION from the
# GSHHG v2.3.7 coastline (LGPL v3+) plus named closing-section anchors.
# It is NOT an official government polygon.

version: v0
dataset_id: zhejiang_multibay_m21a
stage: M2.1a
issue: 7
generated_for_access_date: "2026-10-01"
analysis_crs: EPSG:32651     # UTM zone 51N; all three bays sit in 120-122E

time_axis:
  start_year: 1985
  end_year: 2026

# ---------------------------------------------------------------------------
# Base coastline for the Tier-C derivation (pinned; bytes live outside Git)
# ---------------------------------------------------------------------------
base_coastline:
  id: gshhg_v2_3_7_h_l1
  title: GSHHG high-resolution shoreline, level 1 (land/ocean boundary)
  version: "2.3.7"
  resolution_level: h
  url: http://www.soest.hawaii.edu/pwessel/gshhg/gshhg-shp-2.3.7.zip
  archive_sha256: 8dbbe7e071e77e9e75f2d639239099ebca8d5c16d6a07df8169729d49f15cf41
  shp_relpath: GSHHS_shp/h/GSHHS_h_L1.shp
  shp_sha256: d870bdbc90a074f87a8c09a9630abb5f18916314b9a196dba2e6866fd51ef325
  source_crs: EPSG:4326
  license: LGPL-3.0-or-later (with GSHHG attribution notice; see LICENSE.TXT)
  citation: Wessel, P. & Smith, W.H.F. (1996), JGR Solid Earth,
            DOI 10.1029/96JB00104; GSHHG v2.3.7 (2017 release)
  shoreline_meaning: MEAN_SHORELINE_APPROXIMATION
  local_path: work/sources/GSHHS_shp/h/GSHHS_h_L1.shp
  notes: >
    Mean-shoreline product: in macrotidal embayments the instantaneous
    shoreline deviates by kilometres across the tidal cycle. Derived bay
    water areas are therefore NOT chart-datum sea areas.

# ---------------------------------------------------------------------------
# Bay anchors. kind=SECTION_POINT snaps to the nearest GSHHG coastline
# vertex within snap_radius_m (largest deviation is logged, never silent).
# kind=CONSTRUCTION_CORNER is an onshore envelope corner used as-is; the
# builder asserts it falls on land. Coordinates are approximate place
# locations in WGS84 decimal degrees (PROVISIONAL by definition).
# ---------------------------------------------------------------------------
