[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spartina-earth"
version = "0.0.1"
description = "Long-term, sensor-agnostic Earth observation + AI research system for Spartina alterniflora (M0 reboot: interfaces and specifications only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Spartina Technology / Spartina Earth contributors" }]
keywords = [
    "remote-sensing",
    "earth-observation",
    "invasive-species",
    "spartina-alterniflora",
    "multimodal",
    "time-series",
]

# M0 intentionally keeps runtime dependencies at zero: all skeleton modules
# and smoke tests use the Python standard library only. Heavy geospatial / ML
# dependencies are introduced in later milestones as optional extras.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
# Reserved for M1+; NOT installed during M0.
gee = ["earthengine-api>=0.1.400"]
geo = ["rasterio>=1.3", "shapely>=2.0", "pyproj>=3.6", "geopandas>=0.14"]
ml = ["torch>=2.2", "torchvision>=0.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
markers = [
    "gee_integration: integration tests requiring real Google Earth Engine credentials (deselected by default)",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]
# Legacy prototype is preserved verbatim (see legacy/README.md); its known
# defects are documented in docs/audit/LEGACY_RESULT_AUDIT.md, not "fixed".
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E741"]

[tool.mypy]
python_version = "3.10"
files = ["src", "scripts"]
strict = true
warn_unused_ignores = true
warn_return_any = true
# M0 skeleton contains interface-only modules with deliberately broad typing;
# keep strict checks on, modules may add targeted ignores with justification.
