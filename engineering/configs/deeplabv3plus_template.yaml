# DeepLabV3+ (ResNet-50) semantic segmentation template.
inherits: common_template.yaml

model:
  type: deeplabv3plus
  backbone: resnet50
  pretrained_backbone: false
  output_stride: 16
  atrous_rates: [6, 12, 18]

training:
  batch_size: 8
  lr: 0.0001
  search_configs: 8           # shared budget for semantic-seg class
  seeds: [42, 17, 2026]
