# Common experiment configuration template (all models).
# Filled values marked FROZEN come from the protocol; blanks marked TODO
# are set per run before manifest generation — never edited inline.
# Provenance fields are enforced by engineering/run_manifest/generate_run_manifest.py.

run:
  run_id: TODO            # e.g. r001_stageA_id_unet_s42
  stage: A                # A|B|C|D per EXPERIMENT_EXECUTION_PLAN
  seed: 42                # one of {42, 17, 2026}
  git_sha: null           # filled by run manifest generator

data:
  dataset_manifest: null            # path to frozen DATASET_MANIFEST json
  dataset_manifest_sha256: null     # mandatory
  split_id: null                    # mandatory, frozen split reference
  qa_ledger_ref: null               # mandatory, QA verdict ledger path
  sensors: [sentinel2]              # subset of [landsat8, landsat7, sentinel2, sentinel1]
  resolution_family: 10m            # 10m|30m — never mixed within a run
  bands:                            # identity-tagged band list (SENSOR_COMPATIBILITY_MATRIX.csv)
    - {name: B2, role: blue, wavelength_um: 0.49}
    - {name: B3, role: green, wavelength_um: 0.56}
    - {name: B4, role: red, wavelength_um: 0.665}
    - {name: B8, role: nir, wavelength_um: 0.842}
  valid_mask: valid_r2              # frozen VALID predicate reference
  # Test cells are NEVER loaded during development/tuning.
  roles_allowed: [train, validation]

training:
  max_epochs: 60
  batch_size: 16
  lr: 0.0001                  # shared search space per architecture class
  schedule: cosine
  weight_decay: 0.0001
  loss: dice_bce              # shared across models of the same class
  early_stop_metric: val_iou  # validation-only model selection
  early_stop_patience: 10
  precision: fp32             # fp16 allowed after smoke validation

evaluation:
  thresholds_from: validation       # threshold selection on validation only
  metrics: [iou, f1, precision, recall, boundary_f1, small_patch_recall,
            area_bias, area_error, ece, brier, nll]
  boundary_tolerances_px: [1, 2, 4]
  small_patch_max_px: 9
  bootstrap: {clusters: cell, n_boot: 2000, seed: 2026, level: 0.95}

resources:
  gpu_ids: []             # never include 0; max 3; checked by manifest generator
  checkpoint_dir: work/experiments/TODO/checkpoints
  output_dir: work/experiments/TODO

provenance:
  # All fields mandatory at launch; missing fields reject the run manifest.
  environment: spartina-earth
  negative_results_preserved: true
